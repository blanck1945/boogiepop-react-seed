# GitLab CI — boogiepop-react-seed (remote MF)
# Mismo modelo que boogiepop-host/.gitlab-ci.yml — ver docs/GITLAB-DEPLOY.md
#
# Siempre: lint + vite-build.
# Push a develop: docker-publish-remote y deploy-remote-ecs aparecen como MANUAL (como el host).
#
# Variables de proyecto (Settings → CI/CD → Variables), igual que el host:
# - ECR_REGISTRY (123456789012.dkr.ecr.us-east-1.amazonaws.com, sin /repo)
# - AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# ECS usa ECS_CLUSTER_NAME y ECS_FRONT_REMOTE_SERVICE_NAME (defaults abajo).

stages:
  - verify
  - build
  - deploy

default:
  interruptible: true

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

variables:
  AWS_DEFAULT_REGION: us-east-1
  ECS_REFERENCE_TAG: "1.0.0"
  REMOTE_ECR_REPOSITORY: boogiepop-remote
  ECS_CLUSTER_NAME: boogiepop-api-cluster
  ECS_FRONT_REMOTE_SERVICE_NAME: boogiepop-api-fe-remote-svc

lint:
  stage: verify
  image: node:22-bookworm-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - when: never
  script:
    - npm ci
    - npm run lint

vite-build:
  stage: build
  image: node:22-bookworm-slim
  needs: ["lint"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - when: never
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

docker-publish-remote:
  stage: deploy
  image: ubuntu:22.04
  services:
    - name: docker:24-dind
      command: ["--tls=false"]
  needs: ["vite-build"]
  variables:
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    FF_NETWORK_PER_BUILD: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push" && $ECR_REGISTRY'
      when: manual
    - when: never
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates unzip gnupg
    - install -dm755 /etc/apt/keyrings
    - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    - chmod a+r /etc/apt/keyrings/docker.gpg
    - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu jammy stable" > /etc/apt/sources.list.d/docker.list
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker-ce-cli docker-buildx-plugin
    - curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
    - unzip -q /tmp/awscliv2.zip -d /tmp
    - /tmp/aws/install -i /usr/local/aws-cli -b /usr/local/bin
    - aws sts get-caller-identity
    - sleep 3
    - docker info
    - docker buildx create --name ci-remote-build --use 2>/dev/null || docker buildx use ci-remote-build
    - docker run --privileged --rm tonistiigi/binfmt:latest --install all
    - bash -cx 'REG_HOST=$(echo "${ECR_REGISTRY}" | cut -d/ -f1); aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${REG_HOST}"'
  script:
    - |
      set -eux
      BASE_URI="${ECR_REGISTRY}/${REMOTE_ECR_REPOSITORY}"
      IMAGE_URI="${BASE_URI}:${IMAGE_TAG}"
      EXTRA=""
      if [ "${CI_PIPELINE_SOURCE:-}" = "merge_request_event" ] && [ "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}" = "develop" ]; then EXTRA=1; fi
      if [ -n "${CI_COMMIT_TAG:-}" ]; then EXTRA=1; fi
      if [ -n "${EXTRA}" ]; then
        docker buildx build --platform linux/arm64 --provenance=false --sbom=false --push \
          --build-arg "VITE_REMOTE_BASE=${VITE_REMOTE_BASE:-/}" \
          --build-arg "VITE_DEV_SERVER_ORIGIN=${VITE_DEV_SERVER_ORIGIN:-http://localhost:5173}" \
          -t "${IMAGE_URI}" -t "${BASE_URI}:${ECS_REFERENCE_TAG}" -t "${BASE_URI}:latest" .
      else
        docker buildx build --platform linux/arm64 --provenance=false --sbom=false --push \
          --build-arg "VITE_REMOTE_BASE=${VITE_REMOTE_BASE:-/}" \
          --build-arg "VITE_DEV_SERVER_ORIGIN=${VITE_DEV_SERVER_ORIGIN:-http://localhost:5173}" \
          -t "${IMAGE_URI}" -t "${BASE_URI}:develop" .
      fi

deploy-remote-ecs:
  stage: deploy
  dependencies: []
  image:
    name: amazon/aws-cli:2.27.25
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"'
      when: manual
    - when: never
  script:
    - aws sts get-caller-identity
    - aws ecs update-service --cluster "$ECS_CLUSTER_NAME" --service "$ECS_FRONT_REMOTE_SERVICE_NAME" --force-new-deployment --region "$AWS_DEFAULT_REGION"
